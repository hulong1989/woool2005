name: 功能建议
description: 提出新功能、玩法深度或工程改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建议先看 [docs/ARCHITECTURE.md](docs/ARCHITECTURE.md) 与 [README.md](README.md) 的"已知问题"，
        确认建议不属于已知范围。也欢迎直接提交 PR。
  - type: dropdown
    id: area
    attributes:
      label: 方向
      options:
        - 玩法/内容（战斗、任务、副本、社交等）
        - 服务端架构/性能
        - 协议与客户端
        - 工具链 / CI / 文档
        - 数据表 / 地图
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述当前痛点或缺口，而不是直接给实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可附相关文件/函数位置（如 `Monster.cpp:185`）
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已阅读 README 的"已知问题"和 docs/ARCHITECTURE.md
          required: true
